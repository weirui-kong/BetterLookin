name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump MARKETING_VERSION
        id: bump
        run: |
          set -euo pipefail
          PBXPROJ="BetterLookin.xcodeproj/project.pbxproj"
          OLD_VERSION=$(grep -B1 "PRODUCT_BUNDLE_IDENTIFIER = icu.retrouvailles.betterlookin;" "$PBXPROJ" \
            | grep "MARKETING_VERSION" | head -1 | sed -E 's/.*= ([0-9]+\.[0-9]+\.[0-9]+);/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i '' "s/MARKETING_VERSION = ${OLD_VERSION};/MARKETING_VERSION = ${NEW_VERSION};/g" "$PBXPROJ"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BetterLookin.xcodeproj/project.pbxproj
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Build (Release, ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace BetterLookin.xcworkspace \
            -scheme BetterLookin \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build

      - name: Package DMG
        id: dmg
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.new_version }}"
          APP_PATH="build/Build/Products/Release/Better Lookin.app"
          STAGING="dmg-staging"
          DMG_NAME="Better Lookin-${VERSION}.dmg"
          mkdir "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Better Lookin" -srcfolder "$STAGING" -ov -format UDZO "$DMG_NAME"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.new_version }}"
          DMG_NAME="${{ steps.dmg.outputs.dmg_name }}"
          NOTES_FILE="release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## 安装

          下载 \`${DMG_NAME}\`,打开后将 \`Better Lookin.app\` 拖入"应用程序"文件夹。

          如果 macOS 显示 **"Better Lookin.app" is damaged and can't be opened. You should move it to the Trash.**,请确认安装包来自此 Release,然后在"终端"执行:

          \`\`\`
          xattr -dr com.apple.quarantine "/Applications/Better Lookin.app"
          \`\`\`

          完成后再次打开 \`Better Lookin.app\`。
          EOF
          gh release create "v${VERSION}" "$DMG_NAME" \
            --title "v${VERSION}" \
            --notes-file "$NOTES_FILE"
